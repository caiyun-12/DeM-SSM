[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-ssm-reconstruction"
version = "0.1.0"
description = "Auditable research reconstruction of DeM-SSM for driver-drowsiness classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
landmarks = ["mediapipe>=0.10"]

[tool.setuptools.packages.find]
include = ["dem_ssm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
